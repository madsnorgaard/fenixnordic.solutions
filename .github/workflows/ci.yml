name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_recreate:
        description: 'Force recreate containers'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        env:
          NUXT_TELEMETRY_DISABLED: 1

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:copy

      - run: npm run generate
        env:
          NUXT_TELEMETRY_DISABLED: 1

      - name: Assert the generated output
        run: |
          set -eu
          cd .output/public
          for f in index.html da.html aabenforms.html aabenintra.html da/aabenforms.html da/aabenintra.html aabenforms-demo-da.html aabenforms-demo-en.html; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          grep -q 'lang="da-DK"' da/aabenforms.html
          grep -q 'lang="en"' aabenforms.html
          grep -q 'aabenforms-demo-da.html' da/aabenforms.html
          grep -q 'aabenforms-demo-en.html' aabenforms.html
          grep -q 'media/flows/aabenforms-skoleskift-en.webm' aabenforms.html
          grep -q 'property="og:image"' aabenforms.html
          ! grep -q 'data:image' aabenforms.html
          ! grep -q 'data:image' aabenintra.html
          echo "output assertions passed"

      - name: Build the container and smoke test the routes
        run: |
          set -eu
          docker build -t fenix-site .
          docker run -d --rm -p 8080:80 --name fenix-site fenix-site
          sleep 2
          for path in / /da /aabenforms /aabenintra /da/aabenforms /da/aabenintra /aabenforms-demo-da.html /aabenforms-demo-en.html /media/flows/aabenforms-skoleskift-en.webm /fonts/bricolage-grotesque-latin.woff2; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$path")
            echo "$code $path"
            test "$code" = "200"
          done
          for path in /aabenforms/ /aabenforms.html /aabenintra.html; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$path")
            echo "$code $path"
            test "$code" = "301"
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/does-not-exist")
          echo "$code /does-not-exist"
          test "$code" = "404"
          docker stop fenix-site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          repository: madsnorgaard/contabo-infrastructure
          event-type: deploy
          client-payload: |
            {
              "project_dir": "fenixnordic.solutions",
              "project_type": "nuxt",
              "force_recreate": "${{ inputs.force_recreate || false }}"
            }
