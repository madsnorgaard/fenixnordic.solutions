server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Traefik the scheme nginx sees is http; relative redirects keep
    # visitors on https without a second hop.
    absolute_redirect off;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml font/woff2;
    gzip_min_length 256;

    # Hashed build assets and media: cache for a year.
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|avif|ico|svg|woff|woff2|ttf|eot|webm|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML: always revalidate so updates reach visitors.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # The case studies used to be static files. Keep old bookmarks working.
    location = /aabenforms.html { return 301 /aabenforms; }
    location = /aabenintra.html { return 301 /aabenintra; }

    # Prerendered routes are flat files (aabenforms.html, da/aabenforms.html)
    # next to payload directories of the same name (aabenforms/_payload.json).
    # The .html file must win over the directory, or nginx answers with a
    # trailing-slash redirect. Trailing slashes normalise to the canonical path.
    rewrite ^/(.+)/$ /$1 permanent;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Security headers are set by Traefik (see docker-compose.yml).
    # Do not add them here: duplicates conflict with the Traefik middleware.
}
